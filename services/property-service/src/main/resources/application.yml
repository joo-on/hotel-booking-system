spring:
  application:
    name: property-service
  datasource:
    url: jdbc:mysql://localhost:3306/property
    username: ${db.username}
    password: ${db.password}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true